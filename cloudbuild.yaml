steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/letcoach-model:latest", "."]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/letcoach-model:latest"]

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "letcoach-model",
        "--image",
        "gcr.io/$PROJECT_ID/letcoach-model:latest",
        "--platform",
        "managed",
        "--region",
        "us-central1",
        "--allow-unauthenticated",
        "--port",
        "8080",
        "--set-env-vars",
        "SQL_INSTANCE=zinc-strategy-446518-s7:us-central1:letscoach,DB_NAME=main_game,DB_USER=me,DB_PASSWORD=Ab123456",
      ]

images:
  - "gcr.io/$PROJECT_ID/letcoach-model:latest"

options:
  logging: CLOUD_LOGGING_ONLY
